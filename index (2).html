#stage{position:relative;width:min(100vw,480px);height:100%;margin:0 auto;overflow:hidden;container-type:size}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;visibility:hidden;transform:scale(.82);filter:blur(10px);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.8,.2,1),filter .7s ease,visibility 0s .9s}
.scene.on{opacity:1;visibility:visible;transform:none;filter:none;transition-delay:0s}
img{display:block;user-select:none;-webkit-user-drag:none}
h1{font-family:'Alegreya SC',serif;font-weight:900;font-size:11cqw;color:var(--ink);letter-spacing:.02em;text-align:center;line-height:1;text-shadow:0 1px 0 #fff8}
.sub{font-family:'Delius','Be Vietnam Pro',sans-serif;font-size:3.3cqw;color:var(--sub);letter-spacing:.03em;margin:3.6cqw 0 6cqw;text-align:center;-webkit-text-stroke:.35px var(--sub)}
.btns{display:flex;gap:4cqw}
.b{width:min(17cqw,80px);height:min(17cqw,80px);border-radius:50%;border:0;background:var(--btn);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 16px -8px var(--btn);transition:transform .25s cubic-bezier(.3,1.6,.5,1),filter .2s}
.b:hover{transform:scale(1.09);filter:brightness(1.12)}.b:active{transform:scale(.9)}
.b:focus-visible,#env:focus-visible{outline:3px solid var(--btn);outline-offset:4px}
.b svg{width:48%;height:48%;fill:none;stroke:#fdeef0;stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round}
.cat{width:62cqw;margin-bottom:2cqw}.sad{width:50cqw;margin-bottom:3cqw}
#s1.on .cat,#s1b.on .sad{animation:land .9s .15s cubic-bezier(.2,1.4,.4,1) both}
@keyframes land{from{transform:translateY(5cqw) scale(.9);opacity:0}}
/* flowers */
#s2{justify-content:flex-start;padding-top:7.5cqh}
.script{font-family:'Kaushan Script',cursive;color:var(--ink);font-size:10.4cqw;text-align:center;line-height:1.1}
#s2 .sub{margin:2.6cqw 0 0}
.bq{--bh:min(66cqh,calc(92cqw / 0.6070));position:relative;margin-top:1.5cqh;height:var(--bh);width:calc(var(--bh) * 0.6070);flex:none;container-type:inline-size}
.bq>.rw,.bq>.vase{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bq img.l{width:100%;height:100%;filter:var(--fx)}
.rw{transform-origin:50% 86%}
.roses{opacity:0;transform:scale(.15) translateY(10%);transform-origin:50% 90%}
#s2.on .roses{animation:grow 1.4s .55s cubic-bezier(.2,1.25,.4,1) forwards}
#s2.on .rw{animation:sway 6s 2.2s ease-in-out infinite}
@keyframes grow{to{opacity:1;transform:none}}@keyframes sway{50%{transform:rotate(1.6deg)}}
.vase{opacity:0;transform:translateY(8%)}
#s2.on .vase{animation:rise .9s .1s cubic-bezier(.2,.9,.3,1) forwards}@keyframes rise{to{opacity:1;transform:none}}
.vt{position:absolute;left:50.64%;top:77.04%;transform:translate(-50%,-50%);text-align:center;font-family:'Alegreya SC',serif;font-weight:700;letter-spacing:.02em;color:#f4dede;font-size:8.4cqw;line-height:1.28;opacity:0;pointer-events:none;white-space:nowrap}
#s2.on .vt{animation:fade .9s 1.9s forwards}@keyframes fade{to{opacity:1}}
#env{position:absolute;left:61.28%;top:78.99%;width:32.95%;height:18.60%;background:none;border:0;cursor:pointer;padding:0;opacity:0;transform:scale(0) rotate(-40deg)}
#env img{width:100%;height:100%;filter:drop-shadow(0 4px 5px #0003)}
#s2.on #env{animation:pop .8s 2.3s cubic-bezier(.2,1.6,.4,1) forwards}
#s2.on #env img{animation:wig 2.6s 3.2s ease-in-out infinite}
#env:hover img{filter:drop-shadow(0 7px 9px #0004) brightness(1.04)}
@keyframes pop{to{opacity:1;transform:none}}@keyframes wig{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg) translateY(-5%)}}
#s2.on #env.open{animation:none;opacity:0;transform:scale(6) translate(-10%,-45%) rotate(6deg);transition:transform .7s cubic-bezier(.5,0,.8,.4),opacity .45s .2s}
/* letter */
#s3{justify-content:flex-start;align-items:stretch}
